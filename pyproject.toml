[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-maker"
version = "1.0.0"
description = "A Python console app to build your dream PC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "pandas==3.0.6",
    "pillow==12.3.0",
    "selenium==4.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "pip-audit==2.10.1",
]

[tool.setuptools]
py-modules = ["pc_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

# Syntax and undefined-name checks only. The console script keeps its
# existing layout; this does not enforce a full style rewrite.
[tool.ruff.lint]
select = ["E9", "F821", "F822", "F823"]
